name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack incoming ZIP files
        run: |
          if ls incoming/*.zip >/dev/null 2>&1; then
            for z in incoming/*.zip; do unzip -o "$z" -d .; done
            rm -f incoming/*.zip
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add -A
            git commit -m "Unpack phase ZIP" || true
            git push || true
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: AlameenaPrivate-debug-apk
          path: app/build/outputs/apk/debug/*.apk
